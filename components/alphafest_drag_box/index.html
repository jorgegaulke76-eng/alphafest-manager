<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:transparent;font-family:Arial,sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;background:#0c1118;border-radius:10px;overflow:hidden;user-select:none}
#bg{display:block;width:100%;height:auto;pointer-events:none}
#box{
 position:absolute;box-sizing:border-box;border:3px solid #ff2b91;
 background:rgba(255,43,145,.16);cursor:move;transform-origin:center center;
 min-width:18px;min-height:18px;
}
#label{position:absolute;left:4px;top:3px;color:#fff;background:rgba(7,52,155,.9);
 font-size:12px;padding:2px 5px;border-radius:4px;pointer-events:none;white-space:nowrap}
.handle{position:absolute;width:14px;height:14px;background:#fff;border:2px solid #ff2b91;border-radius:50%;
 box-sizing:border-box}
#resize{right:-8px;bottom:-8px;cursor:nwse-resize}
#rotate{left:50%;top:-31px;transform:translateX(-50%);cursor:grab;background:#ffd34d}
#stem{position:absolute;left:50%;top:-18px;width:2px;height:18px;background:#ff2b91;transform:translateX(-50%);pointer-events:none}
#hint{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.68);color:#fff;padding:5px 8px;
 border-radius:6px;font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <img id="bg" alt="">
  <div id="box">
    <div id="label">Caixa</div><div id="stem"></div>
    <div id="rotate" class="handle" title="Girar"></div>
    <div id="resize" class="handle" title="Redimensionar"></div>
  </div>
  <div id="hint">Arraste • canto: tamanho • bolinha amarela: giro</div>
</div>
<script>
(function(){
 const wrap=document.getElementById('wrap'), bg=document.getElementById('bg'), box=document.getElementById('box');
 const label=document.getElementById('label'), resize=document.getElementById('resize'), rotate=document.getElementById('rotate');
 let args={}, zone={x:50,y:188,w:500,h:155,angle:0}, mode=null, sx=0,sy=0,start={};
 function post(type, extra={}){ parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},extra),'*'); }
 function ready(){ post('streamlit:componentReady',{apiVersion:1}); }
 function height(){ post('streamlit:setFrameHeight',{height:Math.ceil(wrap.getBoundingClientRect().height)}); }
 function send(){ post('streamlit:componentValue',{value:zone,dataType:'json'}); }
 function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
 function render(){
   const W=wrap.clientWidth||760, H=W; wrap.style.height=H+'px';
   const x=zone.x*W/1000,y=zone.y*H/1000,w=zone.w*W/1000,h=zone.h*H/1000;
   box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
   box.style.transform='rotate('+(zone.angle||0)+'deg)';
   label.textContent=args.label||'Caixa'; height();
 }
 function eventPos(e){ const p=e.touches?e.touches[0]:e; return {x:p.clientX,y:p.clientY}; }
 function begin(e,m){ e.preventDefault(); e.stopPropagation(); mode=m; const p=eventPos(e); sx=p.x;sy=p.y; start=Object.assign({},zone); }
 box.addEventListener('mousedown',e=>{ if(e.target===resize||e.target===rotate)return; begin(e,'move') });
 resize.addEventListener('mousedown',e=>begin(e,'resize')); rotate.addEventListener('mousedown',e=>begin(e,'rotate'));
 box.addEventListener('touchstart',e=>{ if(e.target===resize||e.target===rotate)return; begin(e,'move') },{passive:false});
 resize.addEventListener('touchstart',e=>begin(e,'resize'),{passive:false});
 rotate.addEventListener('touchstart',e=>begin(e,'rotate'),{passive:false});
 function move(e){
   if(!mode)return; e.preventDefault(); const p=eventPos(e), W=wrap.clientWidth||760,H=wrap.clientHeight||760;
   const dx=(p.x-sx)*1000/W, dy=(p.y-sy)*1000/H;
   if(mode==='move'){
     zone.x=Math.round(clamp(start.x+dx,0,1000-start.w));
     zone.y=Math.round(clamp(start.y+dy,0,1000-start.h));
   } else if(mode==='resize'){
     zone.w=Math.round(clamp(start.w+dx,20,1000-start.x));
     zone.h=Math.round(clamp(start.h+dy,20,1000-start.y));
   } else if(mode==='rotate'){
     const r=wrap.getBoundingClientRect();
     const cx=r.left+(start.x+start.w/2)*W/1000, cy=r.top+(start.y+start.h/2)*H/1000;
     zone.angle=Math.round(Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90);
   }
   render();
 }
 function end(){ if(mode){mode=null;send();} }
 window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
 window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',end);
 window.addEventListener('resize',render);
 window.addEventListener('message',ev=>{
   const d=ev.data||{};
   if(d.type==='streamlit:render'){
     args=d.args||{}; zone=Object.assign({},zone,args.zone||{});
     bg.onload=()=>{render();height();}; bg.src=args.background||''; render();
   }
 });
 ready(); setTimeout(height,50);
})();
</script>
</body>
</html>
