<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0e1117;overflow:hidden;font-family:Arial,sans-serif}#stage{position:relative;width:760px;height:760px;overflow:hidden;touch-action:none;background:#111}#bg{position:absolute;inset:0;width:760px;height:760px;object-fit:fill;user-select:none;pointer-events:none}.box{position:absolute;box-sizing:border-box;border:4px solid #ef2a92;background:rgba(239,42,146,.14);transform-origin:center center;cursor:move;touch-action:none}.label{position:absolute;left:4px;top:3px;color:#fff;background:#ef2a92;padding:2px 5px;font-size:12px;border-radius:3px;pointer-events:none}.handle{position:absolute;width:16px;height:16px;background:#fff;border:3px solid #ef2a92;border-radius:50%;box-sizing:border-box}.resize{right:-10px;bottom:-10px;cursor:nwse-resize}.rotate{left:50%;top:-34px;transform:translateX(-50%);cursor:grab}.stem{position:absolute;left:50%;top:-20px;height:20px;border-left:2px solid #ef2a92;pointer-events:none}.hint{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;padding:5px 8px;border-radius:5px;font-size:12px;pointer-events:none}
</style></head><body><div id="stage"><img id="bg"><div id="box" class="box"><span id="label" class="label">Caixa</span><span class="stem"></span><span id="rot" class="handle rotate"></span><span id="res" class="handle resize"></span></div><div class="hint">Arraste • canto = tamanho • alça superior = giro</div></div>
<script>
const stage=document.getElementById('stage'), box=document.getElementById('box'), bg=document.getElementById('bg'), label=document.getElementById('label'), res=document.getElementById('res'), rot=document.getElementById('rot');
let state={x:50,y:50,w:300,h:100,angle:0}, mode=null, start=null, args={};
function msg(type,data={}){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data),'*')}
function apply(){box.style.left=state.x+'px';box.style.top=state.y+'px';box.style.width=state.w+'px';box.style.height=state.h+'px';box.style.transform=`rotate(${state.angle}deg)`}
function send(){msg('streamlit:setComponentValue',{value:{x:Math.round(state.x*1000/760),y:Math.round(state.y*1000/760),w:Math.round(state.w*1000/760),h:Math.round(state.h*1000/760),angle:Math.round(state.angle*10)/10}})}
function point(e){return{x:e.clientX,y:e.clientY}}
box.addEventListener('pointerdown',e=>{if(e.target===res||e.target===rot)return;mode='move';start={...point(e),...state};box.setPointerCapture(e.pointerId);e.preventDefault()});
res.addEventListener('pointerdown',e=>{mode='resize';start={...point(e),...state};res.setPointerCapture(e.pointerId);e.stopPropagation();e.preventDefault()});
rot.addEventListener('pointerdown',e=>{mode='rotate';const r=box.getBoundingClientRect();start={cx:r.left+r.width/2,cy:r.top+r.height/2,base:state.angle,pa:Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};rot.setPointerCapture(e.pointerId);e.stopPropagation();e.preventDefault()});
window.addEventListener('pointermove',e=>{if(!mode)return;if(mode==='move'){state.x=Math.max(0,Math.min(760-state.w,start.x+(e.clientX-start.x)));state.y=Math.max(0,Math.min(760-state.h,start.y+(e.clientY-start.y)))}else if(mode==='resize'){state.w=Math.max(20,Math.min(760-state.x,start.w+(e.clientX-start.x)));state.h=Math.max(20,Math.min(760-state.y,start.h+(e.clientY-start.y)))}else{let a=Math.atan2(e.clientY-start.cy,e.clientX-start.cx)*180/Math.PI;state.angle=start.base+(a-start.pa);if(state.angle>180)state.angle-=360;if(state.angle<-180)state.angle+=360}apply()});
window.addEventListener('pointerup',()=>{if(mode){mode=null;send()}});
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='streamlit:render')return;args=e.data.args||{};if(args.background)bg.src=args.background;label.textContent=args.label||'Caixa';const z=args.zone||{};state={x:(+z.x||0)*760/1000,y:(+z.y||0)*760/1000,w:Math.max(20,(+z.w||200)*760/1000),h:Math.max(20,(+z.h||80)*760/1000),angle:+z.angle||0};apply();msg('streamlit:setFrameHeight',{height:760})});
msg('streamlit:componentReady',{apiVersion:1});msg('streamlit:setFrameHeight',{height:760});
</script></body></html>
