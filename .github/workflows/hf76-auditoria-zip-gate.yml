name: AlphaFest HF76 - auditoria do ZIP sem deploy
on:
  pull_request:
    branches: [main]
    paths:
      - site_production_service.py
      - test_auditoria_site_hf76.py
      - .github/workflows/hf76-auditoria-zip-gate.yml
  push:
    branches: [feature/hf76-auditoria-pacote-imagens]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias minimas
        run: python -m pip install requests pillow
      - name: Verificar sintaxe
        run: python -m py_compile site_production_service.py test_auditoria_site_hf76.py
      - name: Testar relatorio privado e publicador
        run: python -m unittest -v test_auditoria_site_hf76 test_site_imagens_hf76
