name: AlphaFest HF76 - ficha de produto sem duplicacao base64
on:
  pull_request:
    branches: [main]
    paths:
      - site_imagens_hf76.py
      - test_site_imagens_hf76.py
      - .github/workflows/hf76-ficha-imagem-gate.yml
  push:
    branches: [fix/hf76-referencia-fichas-produtos]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependencias
        run: python -m pip install requests pillow
      - name: Validar sintaxe
        run: python -m py_compile site_imagens_hf76.py test_site_imagens_hf76.py
      - name: Testar imagens e fichas artificiais
        run: python -m unittest -v test_site_imagens_hf76
