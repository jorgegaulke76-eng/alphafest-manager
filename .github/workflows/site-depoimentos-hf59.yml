name: AlphaFest Site - Depoimentos em Imagens (homologacao isolada)
on:
  push:
    branches:
      - feature/site-depoimentos-imagens
      - fix/mobile-overflow-hf59-issue8
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir_depoimentos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout apenas leitura
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verificar Python e 7 cenarios de depoimentos
        run: |
          python -m py_compile site_home_content_service.py test_site_depoimentos_hf59.py
          python -m unittest -v test_site_depoimentos_hf59
      - name: Verificar sintaxe JavaScript da galeria
        run: |
          python -c "from pathlib import Path; from site_home_content_service import HOME_CONTENT_JS; Path('/tmp/alphafest-testimonials-hf59.js').write_text(HOME_CONTENT_JS, encoding='utf-8')"
          node --check /tmp/alphafest-testimonials-hf59.js

      - name: Instalar dependencias para preview HTML completo
        run: |
          python -m pip install "requests>=2.31" "streamlit>=1.51,<2" "playwright>=1.50" "Pillow>=11,<13"
          python -m playwright install --with-deps chromium
      - name: Testar gerador completo em desktop e celular sem dados reais
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_SERVICE_KEY: ""
        run: |
          python scripts/hf59_visual_qa.py
      - name: Conferir overflow mobile e navegacao da issue 8
        run: |
          python scripts/hf59_mobile_overflow_qa.py
      - name: Auditar ZIP de producao REAL somente em memoria, sem publicar
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_SERVICE_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          CLOUDFLARE_API_TOKEN: ""
        run: |
          python scripts/hf59_zip_qa.py
      - name: Auditar quatro JPEGs ficticios usando verificador local
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_SERVICE_KEY: ""
          CLOUDFLARE_API_TOKEN: ""
        run: |
          python scripts/hf59_auditar_jpegs_local.py --self-test
      - name: Validar bloqueios do auditor ZIP oficial com pacotes ficticios
        run: |
          python -m unittest -v test_hf59_verificar_zip_oficial
      - name: Guardar capturas FICTICIAS como evidencia da homologacao
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AlphaFest-HF59-previa-ficticia
          path: artifacts/hf59_visual/
          if-no-files-found: warn
          retention-days: 14
