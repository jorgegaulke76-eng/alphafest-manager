name: AlphaFest Vitrine - gate focal atual
on:
  pull_request:
    branches: [main]
    paths:
      - 'site_vitrine_service.py'
      - 'site_manager_service.py'
      - 'catalogo_modalidade_preco_service.py'
      - 'test_site_depoimentos_hf59.py'
      - 'tests/test_modalidades_preco_site.py'
      - '.github/workflows/site-vitrine-gate-atual.yml'
permissions:
  contents: read
jobs:
  vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
      SUPABASE_SERVICE_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar vitrine e precos atuais sem dados reais
        run: |
          python -m py_compile site_vitrine_service.py site_manager_service.py catalogo_modalidade_preco_service.py
          python -m unittest -v test_site_depoimentos_hf59
          python -m unittest discover -s tests -p test_modalidades_preco_site.py -v
