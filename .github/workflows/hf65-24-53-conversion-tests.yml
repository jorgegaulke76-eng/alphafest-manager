name: HF65.24.53 - Conversao comercial isolada

on:
  push:
    branches:
      - hf65-24-53-conversao-comercial
    paths:
      - 'commercial_conversion_service.py'
      - 'commercial_verified_report.py'
      - 'commercial_private_document_adapter.py'
      - 'commercial_online_document_reader.py'
      - 'tests/test_hf65_24_53_online_reader.py'
      - 'tests/test_hf65_24_53_private_adapter.py'
      - 'commercial_verified_report_preview_ui.py'
      - 'tests/test_hf65_24_53_verified_report.py'
      - 'tests/test_hf65_24_53_staging_flow.py'
      - 'commercial_funnel_audit.py'
      - 'tests/test_hf65_24_53_conversion.py'
      - 'tests/test_hf65_24_53_funnel_audit.py'
      - 'proposal_status.py'
      - 'commercial_attribution_service.py'
      - 'commercial_attribution_sqlite_lab.py'
      - 'tests/test_hf65_24_53_sqlite_lab.py'
      - 'commercial_attribution_preview_ui.py'
      - 'tests/test_hf65_24_53_attribution.py'
      - '.github/workflows/hf65-24-53-conversion-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'commercial_conversion_service.py'
      - 'commercial_verified_report.py'
      - 'commercial_private_document_adapter.py'
      - 'commercial_online_document_reader.py'
      - 'tests/test_hf65_24_53_online_reader.py'
      - 'tests/test_hf65_24_53_private_adapter.py'
      - 'commercial_verified_report_preview_ui.py'
      - 'tests/test_hf65_24_53_verified_report.py'
      - 'tests/test_hf65_24_53_staging_flow.py'
      - 'commercial_funnel_audit.py'
      - 'tests/test_hf65_24_53_conversion.py'
      - 'tests/test_hf65_24_53_funnel_audit.py'
      - 'proposal_status.py'
      - 'commercial_attribution_service.py'
      - 'commercial_attribution_sqlite_lab.py'
      - 'tests/test_hf65_24_53_sqlite_lab.py'
      - 'commercial_attribution_preview_ui.py'
      - 'tests/test_hf65_24_53_attribution.py'
      - '.github/workflows/hf65-24-53-conversion-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar branch de desenvolvimento
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe sem segredos ou banco
        run: python -m py_compile commercial_conversion_service.py commercial_verified_report.py commercial_private_document_adapter.py commercial_online_document_reader.py commercial_verified_report_preview_ui.py commercial_funnel_audit.py commercial_attribution_service.py commercial_attribution_sqlite_lab.py commercial_attribution_preview_ui.py proposal_status.py tests/test_hf65_24_53_conversion.py tests/test_hf65_24_53_funnel_audit.py tests/test_hf65_24_53_attribution.py tests/test_hf65_24_53_sqlite_lab.py tests/test_hf65_24_53_verified_report.py tests/test_hf65_24_53_staging_flow.py tests/test_hf65_24_53_private_adapter.py
      - name: Instalar pytest local
        run: python -m pip install pytest
      - name: Contrato de conversao e auditoria
        run: python -m pytest -q tests/test_hf65_24_53_*.py
