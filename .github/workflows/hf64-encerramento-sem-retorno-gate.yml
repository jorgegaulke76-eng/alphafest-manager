name: AlphaFest HF64 - encerramento manual de retornos (sem deploy)
on:
  push:
    branches: [feature/hf64-encerramento-assistido-sem-retorno]
  pull_request:
    branches: [main]
    paths:
      - app.py
      - central_oportunidades.py
      - encerramento_sem_retorno_hf64.py
      - test_encerramento_sem_retorno_hf64.py
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile app.py central_oportunidades.py encerramento_sem_retorno_hf64.py test_encerramento_sem_retorno_hf64.py
      - name: Casos comerciais ficticios
        run: python -m unittest -v test_encerramento_sem_retorno_hf64
      - name: Arquivos essenciais preservados
        run: |
          test -s app.py
          test -s requirements.txt
          test -s central_oportunidades.py
          test -s thu_comercial_service.py
          test -s proposal_status.py
