name: AlphaFest HF68 - conferencia de vinculos sem escrita
on:
  pull_request:
    branches: [main]
    paths:
      - central_oportunidades.py
      - conferencia_vinculos_hf68.py
      - test_conferencia_vinculos_hf68.py
      - .github/workflows/hf68-conferencia-vinculos-gate.yml
  push:
    branches: [feature/hf68-fila-conferencia-vinculos]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe
        run: python -m py_compile central_oportunidades.py conferencia_vinculos_hf68.py test_conferencia_vinculos_hf68.py
      - name: Testes sinteticos, sem banco ou rede
        run: python -m unittest -v test_conferencia_vinculos_hf68
