name: AlphaFest HF74 - interface comercial sem mutacao
on:
  pull_request:
    branches: [main]
    paths:
      - central_oportunidades.py
      - test_interface_comercial_hf74.py
      - .github/workflows/hf74-interface-comercial-gate.yml
  push:
    branches: [feature/hf74-interface-comercial-enxuta]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir sintaxe
        run: python -m py_compile central_oportunidades.py test_interface_comercial_hf74.py
      - name: Testar organizacao e consultas com dados artificiais
        run: python -m unittest -v test_interface_comercial_hf74 test_consulta_roteiro_hf73 test_roteiro_diario_hf72 test_resumo_diario_hf71 test_prioridades_comerciais_hf70 test_conferencia_vinculos_hf68 test_filtros_conferencia_hf69
