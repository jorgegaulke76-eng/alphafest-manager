name: AlphaFest HF60 - Gate unico Caixa e Precos (SEM DEPLOY)
on:
  push:
    branches: [feature/hf65-24-60-caixa-precos]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alphafest-hf60-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_SERVICE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_ANON_KEY: ""
      CLOUDFLARE_API_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias do projeto
        run: python -m pip install -r requirements.txt
      - name: Caixa - arquivos e falhas online ficticias
        run: python -m unittest -v test_hf60_storage_isolado test_ficha_producao_hf58
      - name: Precos - tres modalidades e compatibilidade
        run: python -m unittest discover -s tests -p test_modalidades_preco_site.py -v
      - name: Regressao focal do site HF59
        run: python -m unittest -v test_site_depoimentos_hf59
