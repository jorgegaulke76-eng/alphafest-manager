name: AlphaFest HF73 - consulta local segura
on:
  pull_request:
    branches: [main]
    paths:
      - central_oportunidades.py
      - consulta_roteiro_hf73.py
      - test_consulta_roteiro_hf73.py
      - .github/workflows/hf73-consulta-roteiro-gate.yml
  push:
    branches: [feature/hf73-consulta-rapida-roteiro]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe
        run: python -m py_compile central_oportunidades.py consulta_roteiro_hf73.py test_consulta_roteiro_hf73.py
      - name: Testes artificiais sem banco
        run: python -m unittest -v test_consulta_roteiro_hf73 test_roteiro_diario_hf72 test_resumo_diario_hf71 test_prioridades_comerciais_hf70
