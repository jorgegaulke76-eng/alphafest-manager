name: AlphaFest SEO local - Itatiba
on:
  push:
    branches: [seo-local-itatiba-20261127]
    paths:
      - 'site_production_service.py'
      - 'test_seo_local_itatiba.py'
      - '.github/workflows/seo-local-itatiba-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site_production_service.py'
      - 'test_seo_local_itatiba.py'
      - '.github/workflows/seo-local-itatiba-gate.yml'
permissions:
  contents: read
jobs:
  seo-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install requests pytest
      - name: Validate syntax
        run: python -m py_compile site_production_service.py test_seo_local_itatiba.py
      - name: Run local SEO tests
        run: python -m unittest -v test_seo_local_itatiba
      - name: Run production package regression
        run: python -m pytest -q tests/test_hf65_24_52_release_preflight.py
